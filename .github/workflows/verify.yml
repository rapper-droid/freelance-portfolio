name: verify
on:
  push:
    branches:
      [
        main,
        codex/portfolio-sales-hub-v2,
        codex/portfolio-figma-sales-ui,
        codex/portfolio-final-art-direction,
      ]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run format:check
      - run: npm run verify
      - run: npm run test:e2e
      - run: npm run qa:visual
      - run: npm run qa:design
      - run: npm run qa:links
      - run: npm run qa:performance
      # The ledgers are built by requesting the running site, so they
      # come after the build and cannot drift from what is served.
      - run: npm run qa:inventory
      - run: npm run qa:contracts
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: portfolio-qa
          path: |
            playwright-report/
            artifacts/e2e-screenshots/
            docs/screenshots/portfolio/visual-report.json
            docs/screenshots/sales-ui/
            docs/link-report.json
            docs/performance/
