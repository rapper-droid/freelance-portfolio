name: verify
on:
  push:
    branches: [main, codex/portfolio-sales-hub-v2]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run format:check
      - run: npm run verify
      - run: npm run test:e2e
      - run: npm run qa:visual
      - run: npm run qa:links
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: portfolio-qa
          path: |
            playwright-report/
            docs/screenshots/portfolio/visual-report.json
            docs/link-report.json
